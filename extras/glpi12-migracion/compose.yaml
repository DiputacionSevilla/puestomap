# Staging de GLPI 12 en el MISMO host que el GLPI 10 de producción (glpi-ocs, 2 vCPU / 2,9 GB RAM).
# Cambios respecto al paquete original (ver CORRECCIONES.md): MySQL 8.0 (mismo motor que el origen),
# límites de memoria, sin reinicio automático.
name: glpi12_migracion

services:
  db:
    image: mysql:8.0
    # Sin "restart": el staging no debe arrancar solo tras un reinicio del host de producción.
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    mem_limit: 768m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${GLPI_DB_NAME:-glpi}
      MYSQL_USER: ${GLPI_DB_USER:-glpi}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD:?Definir GLPI_DB_PASSWORD en .env}
      TZ: Europe/Madrid
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - backend

  glpi:
    image: glpi/glpi:12.0.1   # confirmar que la etiqueta existe y fijar el digest
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?Definir GLPI_DB_PASSWORD en .env}
      # Nombres de variables PENDIENTES DE CONFIRMAR contra el README de glpi-project/docker-images
      GLPI_SKIP_AUTOINSTALL: "true"
      GLPI_SKIP_AUTOUPDATE: "true"
      GLPI_CRONTAB_ENABLED: "0"
      TZ: Europe/Madrid
    ports:
      - "${GLPI_BIND_IP:-127.0.0.1}:${GLPI_HOST_PORT:-18080}:80"
    volumes:
      - ./data/glpi:/var/glpi
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:
