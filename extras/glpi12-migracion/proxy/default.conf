# nginx delante de GLPI 12 (detras de Nginx Proxy Manager, que termina TLS).
# GLPI 12 sirve en la raiz y no respeta un prefijo: la web va en "/", y "/glpi/" queda solo para
# compatibilidad de agentes (inventory.php) y API REST (PuestoMap). El resto de /glpi/... redirige a /...

# Respeta el esquema que manda Nginx Proxy Manager (https); si no hay cabecera, usa el propio.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

# Subredes autorizadas a enviar inventarios (AJUSTAR antes de producir; hoy: todo permitido).
geo $inventario_permitido {
  default 1;
  # default 0;
  # 10.158.0.0/16 1;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 64m;
  proxy_read_timeout 120s;
  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP         $remote_addr;

  # Compatibilidad: URLs actuales de agentes (inventory.php) y API REST bajo /glpi/
  location ~ ^/glpi/(front/inventory\.php|apirest\.php)(/.*)?$ {
    if ($inventario_permitido = 0) { return 403; }
    rewrite ^/glpi/(.*)$ /$1 break;
    proxy_pass http://glpi:80;
  }

  # Marcadores antiguos de usuarios: /glpi/... -> /...
  location /glpi/ { rewrite ^/glpi/(.*)$ $fwd_proto://$http_host/$1 redirect; }
  location = /glpi { return 301 $fwd_proto://$http_host/; }

  location / { proxy_pass http://glpi:80; }
}
