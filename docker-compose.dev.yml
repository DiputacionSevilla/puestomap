name: puestomap
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: puestomap
      POSTGRES_USER: puestomap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puestomap}
      TZ: Europe/Madrid
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puestomap -d puestomap"]
      interval: 10s
      retries: 5

volumes:
  pgdata-dev:
