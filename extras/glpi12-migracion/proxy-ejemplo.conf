# Ejemplo (nginx/openresty) probado en el staging el 2026-11-10.
# GLPI 12 sirve en la raiz y NO respeta un prefijo: la web va en "/", y "/glpi/" queda solo
# para compatibilidad con agentes (inventory.php) y la API REST de PuestoMap.
upstream glpi12 { server 127.0.0.1:18080; }   # en la VM definitiva: el contenedor glpi

server {
  server_name soporte.mairenadelalcor.net;
  client_max_body_size 64m;

  # Compatibilidad: URLs actuales de agentes y PuestoMap (probado: responde igual que GLPI 10)
  location ~ ^/glpi/(front/inventory\.php|apirest\.php|front/inventory\.php/.*|apirest\.php/.*)$ {
    rewrite ^/glpi/(.*)$ /$1 break;
    proxy_pass http://glpi12;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # Marcadores de usuarios: /glpi/loquesea -> raiz
  location /glpi/ { rewrite ^/glpi/(.*)$ /$1 redirect; }

  location / {
    proxy_pass http://glpi12;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
# Limitar /front/inventory.php por IP si se deja auth_required=none (allow <subredes>; deny all;).
